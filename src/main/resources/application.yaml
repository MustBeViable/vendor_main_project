
spring:
  application:
    name: vendor_main

  datasource:
    url: ${VENDOR_DB_URL:jdbc:mariadb://localhost:3306/store_app}
    username: ${VENDOR_DB_USERNAME:vendor_app}
    password: ${VENDOR_DB_PASSWORD}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}
          audiences:
            - ${JWT_AUDIENCE}

app:
  reporting:
    employee:
      username: employee
      password: ${EMPLOYEE_DB_PASSWORD}

    report-viewer:
      username: report_viewer
      password: ${REPORT_VIEWER_DB_PASSWORD}

server:
  port: ${SERVER_PORT:8081}
  address: ${SERVER_BIND_ADDRESS:127.0.0.1}
